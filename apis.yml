name: Infinitopes
description: 'Infinitopes is an Oxford University spinout biotech company (founded 2021, based at the
  BioEscalator in Oxford, UK) developing off-the-shelf precision cancer vaccines aimed at preventing
  deaths from cancer metastases. Its proprietary Precision Immunomics platform identifies tumor-specific
  antigens by integrating immunopeptidomics, advanced laboratory methods, machine learning, and validated
  biological testing across cancer types, paired with engineered viral vectors that elicit protective CD8
  T-cell responses. Surfaced in the API Evangelist network as a portfolio company of Amplify Partners
  (also supported by Cancer Research UK). This is a digital-biology company profile; Infinitopes publishes
  no public developer portal, API documentation, SDKs, or technical integration surface at this time.'
